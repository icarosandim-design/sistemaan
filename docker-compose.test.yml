# =============================================================================
# STACK DE TESTE — isolado do original (banco/volume/portas próprios).
# Mesmo código do original; só os DADOS são separados.
#
# Subir:   docker compose -p sistemaan-test -f docker-compose.test.yml up -d --build
# Ver:     http://localhost:4201   (API em http://localhost:8081)
# Apagar:  docker compose -p sistemaan-test -f docker-compose.test.yml down -v
#          (o -v apaga SÓ o banco de teste; o original não é tocado)
#
# Usa o mesmo .env do projeto (JWT_SECRET_KEY etc.). Seed__DemoData=true popula
# o banco de teste com massa de dados na primeira subida.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: sistemaan-test-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemaan}
      POSTGRES_USER: ${POSTGRES_USER:-sistemaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sistemaan}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sistemaan} -d ${POSTGRES_DB:-sistemaan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistemaan-test-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-sistemaan};Username=${POSTGRES_USER:-sistemaan};Password=${POSTGRES_PASSWORD:-sistemaan}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
      Jwt__Issuer: ${JWT_ISSUER:-SistemaAN}
      Jwt__Audience: ${JWT_AUDIENCE:-SistemaAN.Client}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@sistemaan.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@123}
      Seed__ResetAdminPassword: ${SEED_RESET_ADMIN:-false}
      # Popula massa de dados de teste (somente neste ambiente).
      Seed__DemoData: "true"
    ports:
      - "${TEST_API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistemaan-test-web
    ports:
      - "${TEST_WEB_PORT:-4201}:80"
    depends_on:
      - api

volumes:
  pgdata_test:

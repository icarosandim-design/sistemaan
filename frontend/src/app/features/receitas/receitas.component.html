<section class="pagina">
  <header class="page-head">
    <div class="page-title">
      <h1>Receitas da Casa</h1>
    </div>
    <button mat-flat-button class="btn-cta" (click)="novo()">
      <mat-icon>add</mat-icon>
      Nova receita
    </button>
  </header>

  <!-- Filtros -->
  <div class="filtros">
    <mat-form-field appearance="outline" class="f-busca">
      <mat-label>Buscar por nome ou código</mat-label>
      <input matInput [(ngModel)]="filtroTexto" (ngModelChange)="aplicarFiltro()" placeholder="Ex.: Frango" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="filtroStatus" (ngModelChange)="aplicarFiltro()">
        <mat-option value="">Todos</mat-option>
        <mat-option value="ativo">Ativas</mat-option>
        <mat-option value="inativo">Inativas</mat-option>
      </mat-select>
    </mat-form-field>

    @if (temFiltro) {
      <button mat-button class="limpar" (click)="limparFiltros()">
        <mat-icon>close</mat-icon> Limpar
      </button>
    }
  </div>

  <!-- Tabela -->
  <div class="tabela-card">
    @if (carregando) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <table mat-table [dataSource]="dataSource" matSort class="tabela">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="t-center">Código</th>
        <td mat-cell *matCellDef="let r" class="cel-codigo t-center">{{ r.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="t-center">Nome</th>
        <td mat-cell *matCellDef="let r" class="cel-nome t-center">{{ r.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="base">
        <th mat-header-cell *matHeaderCellDef class="t-center">Base</th>
        <td mat-cell *matCellDef="let r" class="t-center">1 kg cozido</td>
      </ng-container>

      <ng-container matColumnDef="custo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="t-center"
            matTooltip="Custo estimado por kg cozido (gerencial)">Custo/kg cozido</th>
        <td mat-cell *matCellDef="let r" class="t-center cel-custo">{{ fmtMoeda(custoDe(r)) }}</td>
      </ng-container>

      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef class="t-center">Status</th>
        <td mat-cell *matCellDef="let r" class="t-center">
          <span class="chip" [class.chip-inativo]="!r.ativo">{{ r.ativo ? 'Ativa' : 'Inativa' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="t-acoes">
          <button mat-icon-button (click)="editar(r); $event.stopPropagation()" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="alternarStatus(r, $event)" [matTooltip]="r.ativo ? 'Inativar' : 'Ativar'">
            <mat-icon>{{ r.ativo ? 'block' : 'check_circle' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="linha" (click)="editar(row)"></tr>

      <tr class="sem-dados" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">Nenhuma receita encontrada.</td>
      </tr>
    </table>
  </div>
</section>

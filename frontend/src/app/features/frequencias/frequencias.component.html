<section class="pagina">
  <header class="page-head">
    <div class="page-title">
      <h1>Frequências de Entrega</h1>
    </div>
    <button mat-flat-button class="btn-cta" (click)="novo()">
      <mat-icon>add</mat-icon>
      Nova frequência
    </button>
  </header>

  <div class="filtros">
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="filtroStatus">
        <mat-option value="">Todos</mat-option>
        <mat-option value="ativo">Ativas</mat-option>
        <mat-option value="inativo">Inativas</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="tabela-card">
    @if (carregando) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <table mat-table [dataSource]="lista" class="tabela">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let f" class="cel-nome">{{ f.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="ciclo">
        <th mat-header-cell *matHeaderCellDef class="t-center">Ciclo</th>
        <td mat-cell *matCellDef="let f" class="t-center cel-ciclo">
          {{ f.personalizada ? 'Personalizada' : f.diasCiclo + ' dias' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let f" class="cel-desc">{{ f.descricao }}</td>
      </ng-container>

      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef class="t-center">Status</th>
        <td mat-cell *matCellDef="let f" class="t-center">
          <span class="chip" [class.chip-inativo]="!f.ativo">{{ f.ativo ? 'Ativa' : 'Inativa' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let f" class="t-acoes">
          <button mat-icon-button (click)="editar(f); $event.stopPropagation()" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="alternarStatus(f, $event)" [matTooltip]="f.ativo ? 'Inativar' : 'Ativar'">
            <mat-icon>{{ f.ativo ? 'block' : 'check_circle' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="linha" (click)="editar(row)"></tr>

      <tr class="sem-dados" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">Nenhuma frequência encontrada.</td>
      </tr>
    </table>
  </div>
</section>
